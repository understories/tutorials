<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Write flow diagram">
  <title>Data Flow - Write</title>
  <desc>Write flow showing how a user action becomes a signed Arkiv transaction recorded on the blockchain and visible in the explorer.</desc>
  
  <defs>
    <style>
      .flow-box { fill: #fff7ed; stroke: #fb923c; stroke-width: 2.5; }
      .flow-box-neutral { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 2.5; }
      .arrow { stroke: #fb923c; stroke-width: 3; fill: none; marker-end: url(#arrowhead-orange); }
      .arrow-neutral { stroke: #9ca3af; stroke-width: 3; fill: none; marker-end: url(#arrowhead-gray); }
      .text-label { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #1f2937; font-weight: 600; }
      .text-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6b7280; font-weight: 400; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; fill: #111827; font-weight: 700; text-anchor: middle; }
      .shadow { filter: url(#drop-shadow); }
    </style>
    <marker id="arrowhead-orange" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 12 6, 0 12" fill="#fb923c" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 12 6, 0 12" fill="#9ca3af" />
    </marker>
    <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <text x="300" y="35" class="text-title">Write Flow</text>
  
  <rect x="200" y="60" width="200" height="70" rx="10" class="flow-box shadow"/>
  <text x="300" y="90" text-anchor="middle" class="text-label">User Action</text>
  <text x="300" y="110" text-anchor="middle" class="text-subtitle">Submit form or click</text>
  
  <line x1="300" y1="130" x2="300" y2="150" class="arrow"/>
  
  <rect x="200" y="150" width="200" height="70" rx="10" class="flow-box shadow"/>
  <text x="300" y="180" text-anchor="middle" class="text-label">API Route</text>
  <text x="300" y="200" text-anchor="middle" class="text-subtitle">Next.js API handler</text>
  
  <line x1="300" y1="220" x2="300" y2="240" class="arrow"/>
  
  <rect x="200" y="240" width="200" height="70" rx="10" class="flow-box shadow"/>
  <text x="300" y="270" text-anchor="middle" class="text-label">Wallet Signs</text>
  <text x="300" y="290" text-anchor="middle" class="text-subtitle">User approves transaction</text>
  
  <line x1="300" y1="310" x2="300" y2="330" class="arrow"/>
  
  <rect x="200" y="330" width="200" height="70" rx="10" class="flow-box shadow"/>
  <text x="300" y="360" text-anchor="middle" class="text-label">Arkiv Transaction</text>
  <text x="300" y="380" text-anchor="middle" class="text-subtitle">Broadcast to network</text>
  
  <line x1="300" y1="400" x2="300" y2="420" class="arrow-neutral"/>
  
  <rect x="200" y="420" width="200" height="70" rx="10" class="flow-box-neutral shadow"/>
  <text x="300" y="450" text-anchor="middle" class="text-label">Blockchain</text>
  <text x="300" y="470" text-anchor="middle" class="text-subtitle">Permanently recorded</text>
  
  <text x="300" y="495" text-anchor="middle" class="text-subtitle" font-weight="600" fill="#10b981">✓ Explorer Visible</text>
</svg>
