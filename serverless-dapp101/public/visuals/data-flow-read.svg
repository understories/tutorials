<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Read flow diagram">
  <title>Data Flow - Read</title>
  <desc>Read flow showing how application data is queried from Arkiv and displayed in the user interface.</desc>
  
  <defs>
    <style>
      .flow-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .arrow { stroke: #3b82f6; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-blue); }
      .text-label { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #1f2937; font-weight: 600; }
      .text-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6b7280; font-weight: 400; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; fill: #111827; font-weight: 700; text-anchor: middle; }
      .shadow { filter: url(#drop-shadow); }
    </style>
    <marker id="arrowhead-blue" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 6 3, 0 6" fill="#3b82f6" />
    </marker>
    <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <text x="300" y="35" class="text-title">Read Flow</text>
  
  <rect x="200" y="60" width="200" height="70" rx="10" class="flow-box shadow"/>
  <text x="300" y="88" text-anchor="middle" class="text-label">User Request</text>
  <text x="300" y="108" text-anchor="middle" class="text-subtitle">User interacts with UI</text>
  
  <line x1="300" y1="130" x2="300" y2="150" class="arrow"/>
  
  <rect x="200" y="150" width="200" height="70" rx="10" class="flow-box shadow"/>
  <text x="300" y="178" text-anchor="middle" class="text-label">API Route</text>
  <text x="300" y="198" text-anchor="middle" class="text-subtitle">Next.js API handler</text>
  
  <line x1="300" y1="220" x2="300" y2="240" class="arrow"/>
  
  <rect x="200" y="240" width="200" height="70" rx="10" class="flow-box shadow"/>
  <text x="300" y="268" text-anchor="middle" class="text-label">Query Arkiv</text>
  <text x="300" y="288" text-anchor="middle" class="text-subtitle">Fetch from network</text>
  
  <line x1="300" y1="310" x2="300" y2="330" class="arrow"/>
  
  <rect x="200" y="330" width="200" height="70" rx="10" class="flow-box shadow"/>
  <text x="300" y="358" text-anchor="middle" class="text-label">Return Data</text>
  <text x="300" y="378" text-anchor="middle" class="text-subtitle">JSON response</text>
  
  <line x1="300" y1="400" x2="300" y2="420" class="arrow"/>
  
  <rect x="200" y="420" width="200" height="70" rx="10" class="flow-box shadow"/>
  <text x="300" y="448" text-anchor="middle" class="text-label">Display in UI</text>
  <text x="300" y="468" text-anchor="middle" class="text-subtitle">Render to user</text>
</svg>
