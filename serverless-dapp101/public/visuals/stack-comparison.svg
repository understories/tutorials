<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Development stack comparison">
  <title>Development Stack Comparison</title>
  <desc>Comparison of the Vibes to App development stack with the Serverless DApp stack, highlighting Arkiv as the new decentralized data layer.</desc>
  
  <defs>
    <style>
      .stack-item { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 2; }
      .stack-item-new { fill: #dbeafe; stroke: #3b82f6; stroke-width: 3; }
      .text-label { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #1f2937; font-weight: 600; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; fill: #111827; font-weight: 700; }
      .text-new { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #3b82f6; font-weight: 700; }
      .shadow { filter: url(#drop-shadow); }
    </style>
    <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Vibes to App Stack -->
  <g id="vibes-stack">
    <text x="200" y="40" text-anchor="middle" class="text-title">Vibes to App:</text>
    
    <rect x="50" y="60" width="300" height="60" rx="8" class="stack-item shadow"/>
    <text x="200" y="100" text-anchor="middle" class="text-label">Next.js</text>
    
    <rect x="50" y="140" width="300" height="60" rx="8" class="stack-item shadow"/>
    <text x="200" y="180" text-anchor="middle" class="text-label">TypeScript</text>
    
    <rect x="50" y="220" width="300" height="60" rx="8" class="stack-item shadow"/>
    <text x="200" y="260" text-anchor="middle" class="text-label">Tailwind</text>
    
    <rect x="50" y="300" width="300" height="60" rx="8" class="stack-item shadow"/>
    <text x="200" y="340" text-anchor="middle" class="text-label">Database ?</text>
  </g>
  
  <!-- Serverless DApp Stack -->
  <g id="serverless-stack">
    <text x="700" y="40" text-anchor="middle" class="text-title">Serverless DApp:</text>
    
    <rect x="550" y="60" width="300" height="60" rx="8" class="stack-item shadow"/>
    <text x="700" y="100" text-anchor="middle" class="text-label">Next.js</text>
    
    <rect x="550" y="140" width="300" height="60" rx="8" class="stack-item shadow"/>
    <text x="700" y="180" text-anchor="middle" class="text-label">TypeScript</text>
    
    <rect x="550" y="220" width="300" height="60" rx="8" class="stack-item shadow"/>
    <text x="700" y="260" text-anchor="middle" class="text-label">Tailwind</text>
    
    <rect x="550" y="300" width="300" height="60" rx="8" class="stack-item-new shadow"/>
    <text x="700" y="340" text-anchor="middle" class="text-label">Arkiv</text>
    <text x="700" y="380" text-anchor="middle" class="text-new">← NEW</text>
  </g>
</svg>
