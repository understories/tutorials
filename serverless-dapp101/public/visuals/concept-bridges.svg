<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Concept progression from Vibes to App to Serverless DApp">
  <title>Concept Bridge Diagram</title>
  <desc>Conceptual progression showing how ideas from the Vibes to App workshop extend into serverless and decentralized application concepts.</desc>
  
  <defs>
    <style>
      .concept-box { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1; }
      .arrow-bridge { stroke: #3b82f6; stroke-width: 3; fill: none; marker-end: url(#arrowhead-blue); }
      .text-label { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #1f2937; font-weight: 500; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; fill: #111827; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3b82f6" />
    </marker>
  </defs>
  
  <text x="400" y="30" class="text-title">Vibes to App Concept → Serverless DApp Concept</text>
  
  <!-- Concept 1 -->
  <g id="concept-1">
    <rect x="50" y="60" width="280" height="50" rx="6" class="concept-box"/>
    <text x="190" y="90" text-anchor="middle" class="text-label">"Idea to App"</text>
    
    <line x1="330" y1="85" x2="470" y2="85" class="arrow-bridge"/>
    
    <rect x="470" y="60" width="280" height="50" rx="6" class="concept-box"/>
    <text x="610" y="90" text-anchor="middle" class="text-label">"App to Decentralized App"</text>
  </g>
  
  <!-- Concept 2 -->
  <g id="concept-2">
    <rect x="50" y="130" width="280" height="50" rx="6" class="concept-box"/>
    <text x="190" y="160" text-anchor="middle" class="text-label">"Build Fast"</text>
    
    <line x1="330" y1="155" x2="470" y2="155" class="arrow-bridge"/>
    
    <rect x="470" y="130" width="280" height="50" rx="6" class="concept-box"/>
    <text x="610" y="160" text-anchor="middle" class="text-label">"Build Fast + Own Data"</text>
  </g>
  
  <!-- Concept 3 -->
  <g id="concept-3">
    <rect x="50" y="200" width="280" height="50" rx="6" class="concept-box"/>
    <text x="190" y="230" text-anchor="middle" class="text-label">"Modern Stack"</text>
    
    <line x1="330" y1="225" x2="470" y2="225" class="arrow-bridge"/>
    
    <rect x="470" y="200" width="280" height="50" rx="6" class="concept-box"/>
    <text x="610" y="230" text-anchor="middle" class="text-label">"Modern Stack + Arkiv"</text>
  </g>
  
  <!-- Concept 4 -->
  <g id="concept-4">
    <rect x="50" y="270" width="280" height="50" rx="6" class="concept-box"/>
    <text x="190" y="300" text-anchor="middle" class="text-label">"AI Assisted Dev"</text>
    
    <line x1="330" y1="295" x2="470" y2="295" class="arrow-bridge"/>
    
    <rect x="470" y="270" width="280" height="50" rx="6" class="concept-box"/>
    <text x="610" y="300" text-anchor="middle" class="text-label">"AI + Blockchain Verification"</text>
  </g>
</svg>
