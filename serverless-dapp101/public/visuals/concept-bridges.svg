<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Concept progression from Vibes to App to Serverless DApp">
  <title>Concept Bridge Diagram</title>
  <desc>Conceptual progression showing how ideas from the Vibes to App workshop extend into serverless and decentralized application concepts.</desc>
  
  <defs>
    <style>
      .concept-box-left { fill: #f9fafb; stroke: #3b82f6; stroke-width: 2.5; }
      .concept-box-right { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .arrow-bridge { stroke: #3b82f6; stroke-width: 4; fill: none; marker-end: url(#arrowhead-blue); }
      .text-label { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #1f2937; font-weight: 600; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; fill: #111827; font-weight: 700; text-anchor: middle; }
      .shadow { filter: url(#drop-shadow); }
    </style>
    <marker id="arrowhead-blue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 12 6, 0 12" fill="#3b82f6" />
    </marker>
    <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <text x="450" y="35" class="text-title">Vibes to App → Serverless DApp</text>
  
  <!-- Concept 1 -->
  <g id="concept-1">
    <rect x="50" y="70" width="320" height="60" rx="8" class="concept-box-left shadow"/>
    <text x="210" y="105" text-anchor="middle" class="text-label">"Idea to App"</text>
    
    <line x1="370" y1="100" x2="530" y2="100" class="arrow-bridge"/>
    
    <rect x="530" y="70" width="320" height="60" rx="8" class="concept-box-right shadow"/>
    <text x="690" y="105" text-anchor="middle" class="text-label">"App to Decentralized App"</text>
  </g>
  
  <!-- Concept 2 -->
  <g id="concept-2">
    <rect x="50" y="150" width="320" height="60" rx="8" class="concept-box-left shadow"/>
    <text x="210" y="185" text-anchor="middle" class="text-label">"Build Fast"</text>
    
    <line x1="370" y1="180" x2="530" y2="180" class="arrow-bridge"/>
    
    <rect x="530" y="150" width="320" height="60" rx="8" class="concept-box-right shadow"/>
    <text x="690" y="185" text-anchor="middle" class="text-label">"Build Fast + Own Data"</text>
  </g>
  
  <!-- Concept 3 -->
  <g id="concept-3">
    <rect x="50" y="230" width="320" height="60" rx="8" class="concept-box-left shadow"/>
    <text x="210" y="265" text-anchor="middle" class="text-label">"Modern Stack"</text>
    
    <line x1="370" y1="260" x2="530" y2="260" class="arrow-bridge"/>
    
    <rect x="530" y="230" width="320" height="60" rx="8" class="concept-box-right shadow"/>
    <text x="690" y="265" text-anchor="middle" class="text-label">"Modern Stack + Arkiv"</text>
  </g>
  
  <!-- Concept 4 -->
  <g id="concept-4">
    <rect x="50" y="310" width="320" height="60" rx="8" class="concept-box-left shadow"/>
    <text x="210" y="345" text-anchor="middle" class="text-label">"AI Assisted Dev"</text>
    
    <line x1="370" y1="340" x2="530" y2="340" class="arrow-bridge"/>
    
    <rect x="530" y="310" width="320" height="60" rx="8" class="concept-box-right shadow"/>
    <text x="690" y="345" text-anchor="middle" class="text-label">"AI + Blockchain Verification"</text>
  </g>
</svg>
