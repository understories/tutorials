<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparison of traditional app vs serverless dapp architecture">
  <title>Architecture Comparison</title>
  <desc>Side-by-side comparison of a traditional app where data is stored in a company database versus a serverless dapp where data is stored on the Arkiv network and owned by the user.</desc>
  
  <defs>
    <style>
      .shared { fill: #6b7280; }
      .company-owns { fill: #ef4444; }
      .user-owns { fill: #10b981; }
      .text-label { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #1f2937; font-weight: 500; }
      .text-small { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6b7280; }
      .arrow { stroke: #9ca3af; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9ca3af" />
    </marker>
  </defs>
  
  <!-- Traditional App Column -->
  <g id="traditional-app">
    <rect x="50" y="20" width="300" height="60" rx="8" class="shared" opacity="0.1"/>
    <text x="200" y="50" text-anchor="middle" class="text-label">User</text>
    
    <line x1="200" y1="80" x2="200" y2="100" class="arrow"/>
    
    <rect x="50" y="100" width="300" height="60" rx="8" class="shared" opacity="0.1"/>
    <text x="200" y="130" text-anchor="middle" class="text-label">Frontend (Next.js)</text>
    
    <line x1="200" y1="160" x2="200" y2="180" class="arrow"/>
    
    <rect x="50" y="180" width="300" height="60" rx="8" class="shared" opacity="0.1"/>
    <text x="200" y="210" text-anchor="middle" class="text-label">Backend API</text>
    
    <line x1="200" y1="240" x2="200" y2="260" class="arrow"/>
    
    <rect x="50" y="260" width="300" height="60" rx="8" class="shared" opacity="0.1"/>
    <text x="200" y="290" text-anchor="middle" class="text-label">Database</text>
    
    <line x1="200" y1="320" x2="200" y2="340" class="arrow"/>
    
    <rect x="50" y="340" width="300" height="40" rx="8" class="company-owns" opacity="0.2"/>
    <text x="200" y="365" text-anchor="middle" class="text-label" fill="#ef4444">Company Owns Data ❌</text>
  </g>
  
  <!-- Serverless DApp Column -->
  <g id="serverless-dapp">
    <rect x="450" y="20" width="300" height="60" rx="8" class="shared" opacity="0.1"/>
    <text x="600" y="50" text-anchor="middle" class="text-label">User</text>
    
    <line x1="600" y1="80" x2="600" y2="100" class="arrow"/>
    
    <rect x="450" y="100" width="300" height="60" rx="8" class="shared" opacity="0.1"/>
    <text x="600" y="130" text-anchor="middle" class="text-label">Frontend (Next.js)</text>
    
    <line x1="600" y1="160" x2="600" y2="180" class="arrow"/>
    
    <rect x="450" y="180" width="300" height="60" rx="8" class="shared" opacity="0.1"/>
    <text x="600" y="210" text-anchor="middle" class="text-label">API Routes</text>
    
    <line x1="600" y1="240" x2="600" y2="260" class="arrow"/>
    
    <rect x="450" y="260" width="300" height="60" rx="8" class="shared" opacity="0.1"/>
    <text x="600" y="290" text-anchor="middle" class="text-label">Arkiv Network</text>
    
    <line x1="600" y1="320" x2="600" y2="340" class="arrow"/>
    
    <rect x="450" y="340" width="300" height="40" rx="8" class="user-owns" opacity="0.2"/>
    <text x="600" y="365" text-anchor="middle" class="text-label" fill="#10b981">User Owns Data ✅</text>
  </g>
</svg>
