<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparison of traditional app vs serverless dapp architecture">
  <title>Architecture Comparison</title>
  <desc>Side-by-side comparison of a traditional app where data is stored in a company database versus a serverless dapp where data is stored on the Arkiv network and owned by the user.</desc>
  
  <defs>
    <style>
      .component-box { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; }
      .shared { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 2; }
      .company-owns { fill: #fee2e2; stroke: #ef4444; stroke-width: 2.5; }
      .user-owns { fill: #d1fae5; stroke: #10b981; stroke-width: 2.5; }
      .arrow { stroke: #6b7280; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .text-label { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #1f2937; font-weight: 600; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; fill: #111827; font-weight: 700; text-anchor: middle; }
      .text-result { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #1f2937; font-weight: 700; }
      .shadow { filter: url(#drop-shadow); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280" />
    </marker>
    <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Title -->
  <text x="450" y="35" class="text-title">Architecture Comparison</text>
  
  <!-- Traditional App Column -->
  <g id="traditional-app">
    <text x="200" y="70" text-anchor="middle" class="text-title" font-size="18px" fill="#6b7280">Traditional App</text>
    
    <rect x="50" y="90" width="300" height="70" rx="10" class="component-box shadow"/>
    <text x="200" y="125" text-anchor="middle" class="text-label">User</text>
    
    <line x1="200" y1="160" x2="200" y2="180" class="arrow"/>
    
    <rect x="50" y="180" width="300" height="70" rx="10" class="shared shadow"/>
    <text x="200" y="215" text-anchor="middle" class="text-label">Frontend (Next.js)</text>
    
    <line x1="200" y1="250" x2="200" y2="270" class="arrow"/>
    
    <rect x="50" y="270" width="300" height="70" rx="10" class="shared shadow"/>
    <text x="200" y="305" text-anchor="middle" class="text-label">Backend API</text>
    
    <line x1="200" y1="340" x2="200" y2="360" class="arrow"/>
    
    <rect x="50" y="360" width="300" height="70" rx="10" class="shared shadow"/>
    <text x="200" y="395" text-anchor="middle" class="text-label">Database</text>
    
    <line x1="200" y1="430" x2="200" y2="450" class="arrow"/>
    
    <rect x="50" y="450" width="300" height="40" rx="10" class="company-owns shadow"/>
    <text x="200" y="475" text-anchor="middle" class="text-result" fill="#dc2626">Company Owns Data ❌</text>
  </g>
  
  <!-- Divider -->
  <line x1="450" y1="90" x2="450" y2="490" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Serverless DApp Column -->
  <g id="serverless-dapp">
    <text x="700" y="70" text-anchor="middle" class="text-title" font-size="18px" fill="#6b7280">Serverless DApp</text>
    
    <rect x="550" y="90" width="300" height="70" rx="10" class="component-box shadow"/>
    <text x="700" y="125" text-anchor="middle" class="text-label">User</text>
    
    <line x1="700" y1="160" x2="700" y2="180" class="arrow"/>
    
    <rect x="550" y="180" width="300" height="70" rx="10" class="shared shadow"/>
    <text x="700" y="215" text-anchor="middle" class="text-label">Frontend (Next.js)</text>
    
    <line x1="700" y1="250" x2="700" y2="270" class="arrow"/>
    
    <rect x="550" y="270" width="300" height="70" rx="10" class="shared shadow"/>
    <text x="700" y="305" text-anchor="middle" class="text-label">API Routes</text>
    
    <line x1="700" y1="340" x2="700" y2="360" class="arrow"/>
    
    <rect x="550" y="360" width="300" height="70" rx="10" class="shared shadow"/>
    <text x="700" y="395" text-anchor="middle" class="text-label">Arkiv Network</text>
    
    <line x1="700" y1="430" x2="700" y2="450" class="arrow"/>
    
    <rect x="550" y="450" width="300" height="40" rx="10" class="user-owns shadow"/>
    <text x="700" y="475" text-anchor="middle" class="text-result" fill="#059669">User Owns Data ✅</text>
  </g>
</svg>
