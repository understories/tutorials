<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Walkaway test comparison">
  <title>Walkaway Test Visualization</title>
  <desc>Comparison showing that data stored in a traditional app is lost when the app shuts down, while data stored on Arkiv remains accessible to new applications.</desc>
  
  <defs>
    <style>
      .scenario-box { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; }
      .failure-box { fill: #fee2e2; stroke: #ef4444; stroke-width: 2.5; }
      .success-box { fill: #d1fae5; stroke: #10b981; stroke-width: 2.5; }
      .arrow { stroke: #6b7280; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .text-label { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #1f2937; font-weight: 600; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; fill: #111827; font-weight: 700; }
      .text-result { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; }
      .shadow { filter: url(#drop-shadow); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280" />
    </marker>
    <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Scenario 1: Traditional App -->
  <g id="scenario-1">
    <text x="200" y="40" text-anchor="middle" class="text-title">Scenario 1: Traditional App</text>
    
    <rect x="50" y="60" width="300" height="60" rx="10" class="scenario-box shadow"/>
    <text x="200" y="95" text-anchor="middle" class="text-label">Your App</text>
    
    <line x1="200" y1="120" x2="200" y2="140" class="arrow"/>
    
    <rect x="50" y="140" width="300" height="60" rx="10" class="scenario-box shadow"/>
    <text x="200" y="175" text-anchor="middle" class="text-label">Company Database</text>
    
    <line x1="200" y1="200" x2="200" y2="220" class="arrow"/>
    
    <rect x="50" y="220" width="300" height="60" rx="10" class="failure-box shadow"/>
    <text x="200" y="255" text-anchor="middle" class="text-label">Company shuts down</text>
    
    <line x1="200" y1="280" x2="200" y2="300" class="arrow"/>
    
    <rect x="50" y="300" width="300" height="60" rx="10" class="failure-box shadow"/>
    <text x="200" y="335" text-anchor="middle" class="text-result" fill="#dc2626">Data lost ❌</text>
  </g>
  
  <!-- Scenario 2: Serverless DApp -->
  <g id="scenario-2">
    <text x="700" y="40" text-anchor="middle" class="text-title">Scenario 2: Serverless DApp</text>
    
    <rect x="550" y="60" width="300" height="60" rx="10" class="scenario-box shadow"/>
    <text x="700" y="95" text-anchor="middle" class="text-label">Your App</text>
    
    <line x1="700" y1="120" x2="700" y2="140" class="arrow"/>
    
    <rect x="550" y="140" width="300" height="60" rx="10" class="scenario-box shadow"/>
    <text x="700" y="175" text-anchor="middle" class="text-label">Arkiv Network</text>
    
    <line x1="700" y1="200" x2="700" y2="220" class="arrow"/>
    
    <rect x="550" y="220" width="300" height="60" rx="10" class="success-box shadow"/>
    <text x="700" y="255" text-anchor="middle" class="text-label">Your app shuts down</text>
    
    <line x1="700" y1="280" x2="700" y2="300" class="arrow"/>
    
    <rect x="550" y="300" width="300" height="60" rx="10" class="success-box shadow"/>
    <text x="700" y="335" text-anchor="middle" class="text-result" fill="#059669">Data still on Arkiv ✅</text>
    
    <line x1="700" y1="360" x2="700" y2="380" class="arrow"/>
    
    <rect x="550" y="380" width="300" height="50" rx="10" class="success-box shadow"/>
    <text x="700" y="410" text-anchor="middle" class="text-result" fill="#059669">New App → Same data ✅</text>
  </g>
</svg>
