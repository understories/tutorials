<svg viewBox="0 0 900 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Development path options">
  <title>Path Toggle Visual</title>
  <desc>Two parallel development paths: an AI-assisted path and a manual tutorial path, both leading to a working application.</desc>
  
  <defs>
    <style>
      .path-box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2.5; }
      .arrow { stroke: #3b82f6; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-blue); }
      .text-label { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #1f2937; font-weight: 600; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; fill: #111827; font-weight: 700; }
      .text-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #6b7280; font-weight: 400; }
      .emoji { font-size: 28px; }
      .shadow { filter: url(#drop-shadow); }
    </style>
    <marker id="arrowhead-blue" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 6 3, 0 6" fill="#3b82f6" />
    </marker>
    <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Vibe Path -->
  <g id="vibe-path">
    <rect x="50" y="30" width="350" height="140" rx="12" class="path-box shadow"/>
    <text x="225" y="65" text-anchor="middle" class="text-title">
      <tspan class="emoji">🤖</tspan> Vibe Path (AI-Assisted)
    </text>
    
    <text x="225" y="95" text-anchor="middle" class="text-label">You</text>
    <line x1="225" y1="105" x2="225" y2="125" class="arrow"/>
    
    <text x="225" y="145" text-anchor="middle" class="text-label">AI Agent</text>
    <line x1="225" y1="155" x2="225" y2="160" class="arrow"/>
    
    <text x="225" y="180" text-anchor="middle" class="text-label">Code → App</text>
    
    <text x="225" y="210" text-anchor="middle" class="text-subtitle">Same workflow from Vibes to App!</text>
  </g>
  
  <!-- Manual Path -->
  <g id="manual-path">
    <rect x="500" y="30" width="350" height="140" rx="12" class="path-box shadow"/>
    <text x="675" y="65" text-anchor="middle" class="text-title">
      <tspan class="emoji">✋</tspan> Manual Path
    </text>
    
    <text x="675" y="95" text-anchor="middle" class="text-label">You</text>
    <line x1="675" y1="105" x2="675" y2="125" class="arrow"/>
    
    <text x="675" y="145" text-anchor="middle" class="text-label">Tutorial Steps</text>
    <line x1="675" y1="155" x2="675" y2="160" class="arrow"/>
    
    <text x="675" y="180" text-anchor="middle" class="text-label">Code → App</text>
    
    <text x="675" y="210" text-anchor="middle" class="text-subtitle">Step-by-step instructions</text>
  </g>
</svg>
