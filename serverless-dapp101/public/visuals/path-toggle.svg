<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Development path options">
  <title>Path Toggle Visual</title>
  <desc>Two parallel development paths: an AI-assisted path and a manual tutorial path, both leading to a working application.</desc>
  
  <defs>
    <style>
      .path-box { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 2; }
      .arrow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text-label { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #1f2937; font-weight: 500; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #111827; font-weight: 600; }
      .emoji { font-size: 24px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280" />
    </marker>
  </defs>
  
  <!-- Vibe Path -->
  <g id="vibe-path">
    <rect x="50" y="20" width="300" height="120" rx="8" class="path-box"/>
    <text x="200" y="50" text-anchor="middle" class="text-title">
      <tspan class="emoji">🤖</tspan> Vibe Path (AI-Assisted)
    </text>
    
    <text x="200" y="80" text-anchor="middle" class="text-label">You</text>
    <line x1="200" y1="90" x2="200" y2="110" class="arrow"/>
    
    <text x="200" y="130" text-anchor="middle" class="text-label">AI Agent</text>
    <line x1="200" y1="140" x2="200" y2="160" class="arrow"/>
    
    <text x="200" y="180" text-anchor="middle" class="text-label">Code</text>
    <line x1="200" y1="190" x2="200" y2="210" class="arrow"/>
    
    <text x="200" y="220" text-anchor="middle" class="text-label">App</text>
    
    <text x="200" y="250" text-anchor="middle" class="text-label" font-size="12" fill="#6b7280">Same workflow from Vibes to App!</text>
  </g>
  
  <!-- Manual Path -->
  <g id="manual-path">
    <rect x="450" y="20" width="300" height="120" rx="8" class="path-box"/>
    <text x="600" y="50" text-anchor="middle" class="text-title">
      <tspan class="emoji">✋</tspan> Manual Path
    </text>
    
    <text x="600" y="80" text-anchor="middle" class="text-label">You</text>
    <line x1="600" y1="90" x2="600" y2="110" class="arrow"/>
    
    <text x="600" y="130" text-anchor="middle" class="text-label">Tutorial Steps</text>
    <line x1="600" y1="140" x2="600" y2="160" class="arrow"/>
    
    <text x="600" y="180" text-anchor="middle" class="text-label">Code</text>
    <line x1="600" y1="190" x2="600" y2="210" class="arrow"/>
    
    <text x="600" y="220" text-anchor="middle" class="text-label">App</text>
    
    <text x="600" y="250" text-anchor="middle" class="text-label" font-size="12" fill="#6b7280">Step-by-step instructions</text>
  </g>
</svg>
